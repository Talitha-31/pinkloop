<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Admin – PINKLOOP</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <link rel="icon" href="/assets/img/placeholder.svg">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="mark">✦</div>
        <div>
          <strong id="sidebarStoreName">PINKLOOP</strong>
          <span>Admin Panel</span>
        </div>
      </div>

      <div class="sidebar-label">Menu Utama</div>
      <nav class="sidebar-nav" id="sidebarNav">
        <a href="#dashboard" data-view="dashboard"><span class="ico">▦</span> Dashboard</a>
        <a href="#products" data-view="products"><span class="ico">👕</span> Products</a>
        <a href="#categories" data-view="categories"><span class="ico">🏷️</span> Categories</a>
        <a href="#orders" data-view="orders"><span class="ico">🧾</span> Orders</a>
        <a href="#customers" data-view="customers"><span class="ico">👥</span> Customers</a>
        <a href="#reports" data-view="reports"><span class="ico">📈</span> Reports</a>
        <a href="#settings" data-view="settings"><span class="ico">⚙️</span> Settings</a>
        <button type="button" class="logout" id="sidebarLogout"><span class="ico">⏻</span> Logout</button>
      </nav>

      <div class="sidebar-foot">
        <strong>PINKLOOP Admin</strong>
        Data dashboard terhubung langsung dengan katalog toko.
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <div class="admin-main">
      <header class="admin-header">
        <button class="hamburger" id="hamburger" aria-label="Buka menu sisi">☰</button>
        <div class="headline">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Ringkasan performa toko</p>
        </div>
        <div class="header-right">
          <a class="store-link" href="/index.html" target="_blank" rel="noopener">Lihat Toko ↗</a>
          <div class="profile">
            <div class="avatar" id="profileAvatar">A</div>
            <div class="profile-meta">
              <strong id="profileName">admin</strong>
              <span>Super Admin</span>
            </div>
            <button class="icon-act" id="profileLogout" title="Logout" aria-label="Logout">⏻</button>
          </div>
        </div>
      </header>

      <main class="admin-content" id="viewRoot"></main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="/assets/js/store.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin-core.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
